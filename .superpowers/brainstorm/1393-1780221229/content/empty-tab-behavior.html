<h2>无 NPC 的房间，「交谈」Tab 怎么处理？</h2>
<p class="subtitle">例：地窖、密室等只有事件探查的场景</p>

<div class="panels-row">

  <!-- 方案 D1：隐藏交谈 tab，只显示探查 -->
  <div class="panel-wrapper">
    <div class="scene-label">地窖（无 NPC）</div>
    <div class="game-panel option" data-choice="d1" onclick="toggleSelect(this)" style="cursor:pointer">
      <div class="panel-story">地窖阴冷，角落堆着酒坛。最里头的石墙有道隐约可见的细缝，寒气从中渗出。</div>
      <div class="panel-actions">
        <div class="actions-header"><span>── 操作 ──</span></div>
        <!-- 只剩探查，无 tab -->
        <button class="action-btn">检查酒坛</button>
        <button class="action-btn">推动石墙机括</button>
        <button class="action-btn disabled">进入密室（需前置）</button>
        <button class="action-btn done">✓ 寻找碎片</button>
      </div>
    </div>
    <div class="panel-label">
      <strong>D1 — 只有一类时，隐藏 Tab</strong>
      无交谈内容时直接列出操作，不显示 tab 栏<br>
      <span style="color:#777;font-size:10px">最简洁，tab 按需出现</span>
    </div>
  </div>

  <!-- 方案 D2：交谈 tab 灰显禁用 -->
  <div class="panel-wrapper">
    <div class="scene-label">地窖（无 NPC）</div>
    <div class="game-panel option" data-choice="d2" onclick="toggleSelect(this)" style="cursor:pointer">
      <div class="panel-story">地窖阴冷，角落堆着酒坛。最里头的石墙有道隐约可见的细缝，寒气从中渗出。</div>
      <div class="panel-actions">
        <div class="actions-header"><span>── 操作 ──</span></div>
        <div class="tabs">
          <div class="tab disabled">交谈 —</div>
          <div class="tab active">探查 <span class="tab-badge">3</span></div>
        </div>
        <button class="action-btn">检查酒坛</button>
        <button class="action-btn">推动石墙机括</button>
        <button class="action-btn disabled">进入密室（需前置）</button>
        <button class="action-btn done">✓ 寻找碎片</button>
      </div>
    </div>
    <div class="panel-label">
      <strong>D2 — 交谈 Tab 灰显</strong>
      Tab 栏保持可见，交谈项目为空时显示"—"<br>
      <span style="color:#777;font-size:10px">布局稳定，不会跳动</span>
    </div>
  </div>

</div>

<p style="text-align:center;font-size:12px;color:#999;margin-top:16px">点击选择，或在终端回复</p>
